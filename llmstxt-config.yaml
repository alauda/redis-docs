# llms.txt Generator Configuration for alauda/redis-docs
project_name: "Alauda Cache Service E1 Docs"
summary: "Documentation for Alauda Cache Service E1: architecture, installation, lifecycle, upgrades, and operational how-tos."
body: |
  This index covers user-facing documentation under docs/en/ for managing
  Alauda Cache Service E1 instances on Alauda Container Platform: installation,
  architecture, Kubernetes API references, function guides (creation, access,
  scaling, monitoring, disaster recovery), how-to guides, and troubleshooting.

  Redis® is a registered trademark of Redis Ltd. Any rights therein are
  reserved to Redis Ltd. Any use by Alauda is for referential purposes only and
  does not indicate any sponsorship, endorsement or affiliation between Redis
  Ltd. and Alauda.

include_patterns:
  - "**/*.md"
  - "**/*.mdx"

exclude_patterns:
  - "**/node_modules/**"
  - "**/.git/**"
  - "**/.llmstxt-cache/**"
  - "**/__pycache__/**"
  - "**/dist/**"
  - "**/build/**"
  - "**/llms.txt"
  - "**/llmstxt-state.json"
  - "**/CHANGELOG.md"
  - "**/CONTRIBUTING.md"
  - "README.md"
  - "**/.DS_Store"

grouping_base_path: "docs/en"

batch_size: 15

description_max_words: 150
