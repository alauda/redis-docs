                              type: string
                            value:
                              description: Value of a property to set
                              type: string
                          required:
                          - name
                          - value
                          type: object
                        type: array
                        x-kubernetes-list-type: atomic
                      windowsOptions:
                        description: |-
                          The Windows specific settings applied to all containers.
                          If unspecified, the options within a container's SecurityContext will be used.
                          If set in both SecurityContext and PodSecurityContext, the value specified in SecurityContext takes precedence.
                          Note that this field cannot be set when spec.os.name is linux.
                        properties:
                          gmsaCredentialSpec:
                            description: |-
                              GMSACredentialSpec is where the GMSA admission webhook
                              (https://github.com/kubernetes-sigs/windows-gmsa) inlines the contents of the
                              GMSA credential spec named by the GMSACredentialSpecName field.
                            type: string
                          gmsaCredentialSpecName:
                            description: GMSACredentialSpecName is the name of the
                              GMSA credential spec to use.
                            type: string
                          hostProcess:
                            description: |-
                              HostProcess determines if a container should be run as a 'Host Process' container.
                              All of a Pod's containers must have the same effective HostProcess value
                              (it is not allowed to have a mix of HostProcess containers and non-HostProcess containers).
                              In addition, if HostProcess is true then HostNetwork must also be set to true.
                            type: boolean
                          runAsUserName:
                            description: |-
                              The UserName in Windows to run the entrypoint of the container process.
                              Defaults to the user specified in image metadata if unspecified.
                              May also be set in PodSecurityContext. If set in both SecurityContext and
                              PodSecurityContext, the value specified in SecurityContext takes precedence.
                            type: string
                        type: object
                    type: object
                  service:
                    description: Service is the service for activeredis proxy
                    properties:
                      annotations:
                        additionalProperties:
                          type: string
                        description: Annotations is the annotations for service
                        type: object
                      announceAddress:
                        description: |-
                          AnnounceAddress is the externally-reachable host (DNS name or IP) peers use to
                          reach this instance's proxy — the host on the external LB/F5 VIP (or the
                          LoadBalancer Service), decoupled from the in-cluster Service. Used in mesh
                          mode: the module gossips it verbatim (mesh-announce-addr) and peers re-resolve
                          it on every dial (a DNS name survives IP changes; a multi-A record covers
                          multiple NodePort IPs), and when it is a DNS name the operator binds it to
                          this Service via ExternalDNS. A DNS name is recommended; an IP is acceptable
                          only for a stable VIP. When empty the module falls back to the pod IP, which
                          is not routable across data centers.
                        type: string
                      announcePort:
                        description: |-
                          AnnouncePort is the externally-reachable RESP port peers dial at
                          AnnounceAddress for the mesh CONTROL plane (gossip) and the legacy
                          as.peersync transport — module-side it becomes the announced node
                          record's gossip/legacy dial port (mesh-announce-port). Behind the
                          operator this is the proxy's RESP listener, so it defaults to the proxy
                          Service port (6379); override it only when an external LB/F5 exposes
                          that port under a different number. It does NOT affect the AS_MESH data
                          plane: the module always advertises its own local peer-port (7379) for
                          that, so any external endpoint must expose 7379 as 7379. It is DECOUPLED
                          from the in-cluster Service Port/NodePort; the operator does not copy it
                          into the k8s Service NodePort.
                        format: int32
                        maximum: 65535
                        minimum: 0
                        type: integer
                      enableTLS:
                        description: EnableTLS is the enable tls for activeredis proxy
                        type: boolean
                      port:
                        description: Port custom nodeport for activeredis proxy service
                        format: int32
                        type: integer
                      type:
                        default: NodePort
                        description: Type is the type of service
                        enum:
                        - NodePort
                        - ClusterIP
                        - LoadBalancer
                        type: string
                    type: object
                  tolerations:
                    description: Tolerations is the tolerations for activeredis proxy
                    items:
                      description: |-
                        The pod this Toleration is attached to tolerates any taint that matches
                        the triple <key,value,effect> using the matching operator <operator>.
                      properties:
                        effect:
                          description: |-
                            Effect indicates the taint effect to match. Empty means match all taint effects.
                            When specified, allowed values are NoSchedule, PreferNoSchedule and NoExecute.
                          type: string
                        key:
                          description: |-
                            Key is the taint key that the toleration applies to. Empty means match all taint keys.
                            If the key is empty, operator must be Exists; this combination means to match all values and all keys.
                          type: string
                        operator:
                          description: |-
                            Operator represents a key's relationship to the value.
                            Valid operators are Exists and Equal. Defaults to Equal.
                            Exists is equivalent to wildcard for value, so that a pod can
                            tolerate all taints of a particular category.
                          type: string
                        tolerationSeconds:
                          description: |-
                            TolerationSeconds represents the period of time the toleration (which must be
                            of effect NoExecute, otherwise this field is ignored) tolerates the taint. By default,
                            it is not set, which means tolerate the taint forever (do not evict). Zero and
                            negative values will be treated as 0 (evict immediately) by the system.
                          format: int64
                          type: integer
                        value:
                          description: |-
                            Value is the taint value the toleration matches to.
                            If the operator is Exists, the value should be empty, otherwise just a regular string.
                          type: string
                      type: object
                    type: array
